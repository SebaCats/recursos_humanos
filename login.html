<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<title>Login</title>
</head>

<body>
	<div class="container-fluid m-0 p-0 min-vh-100 row">
		<aside class="container-fluid col-4 bg-primary"></aside>
		<main class="container-fluid col-8 d-flex justify-content-center align-items-center">
			<form id="loginForm" class="p-3" style="width: fit-content;" method="post">
				<div class="mb-3">
					<h1>Te damos la bienvenida</h1>
					<span>Inicia sesión para continuar</span>
				</div>
				<div class="d-flex flex-column mb-3">
					<label for="">Correo corporativo</label>
					<input id="email" class="input-group-text text-start" type="email" placeholder="nombre@empresa.com">
					<label for="">Contraseña</label>
					<input id="password" class="input-group-text text-start" type="password" placeholder="introduce tu contraseña">
				</div>
				<div class="d-flex justify-content-between mb-3">
					<div>
						<input type="checkbox" name="" id="">
						<span>Recordar sesión</span>
					</div>
					<span>¿Olvidaste tu contraseña?</span>
				</div>
				<button class="container-fluid btn bg-primary text-white fw-bold" type="submit">Iniciar sesión -></button>
				<p id="mensajeError" style="color: red; display: none;"></p>
			</form>
		</main>
	</div>
	<script src="js/login.js"></script>
</body>

</html>
